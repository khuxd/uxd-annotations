<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UXD Annotations</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: var(--figma-color-bg, #fff);
    --surface: var(--figma-color-bg-secondary, #f5f5f5);
    --border: var(--figma-color-border, #e6e6e6);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, #666);
    --accent: var(--figma-color-bg-brand, #0d99ff);
    --on-accent: var(--figma-color-text-onbrand, #fff);
    --error: var(--figma-color-text-danger, #f24822);
    --success: var(--figma-color-text-success, #14ae5c);
    --radius: 6px;
    --space: 8px;
    --font: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font: 12px/1.4 var(--font); padding: 12px; }
  h2 { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 16px 0 var(--space); }
  h2:first-child { margin-top: 0; }
  label { display: block; color: var(--text-2); margin-bottom: 4px; }
  textarea, select, input[type=text] { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 8px; }
  textarea { resize: vertical; min-height: 64px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .stack { display: flex; flex-direction: column; gap: var(--space); }
  .row { display: flex; gap: var(--space); align-items: center; }
  button { font: inherit; cursor: pointer; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 10px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.icon { padding: 2px 6px; }
  .note { border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space); display: grid; grid-template-columns: auto 1fr auto; gap: 6px 8px; align-items: start; }
  .note.done .text { text-decoration: line-through; color: var(--text-2); }
  .chip { display: inline-block; border-radius: 99px; padding: 1px 8px; font-size: 10px; font-weight: 600; color: #fff; }
  .meta { color: var(--text-2); font-size: 10px; grid-column: 2 / 4; }
  .cat-row { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space); align-items: center; }
  input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); background: none; }
  #status { margin-top: 12px; min-height: 16px; }
  #status.error { color: var(--error); } #status.success { color: var(--success); }
  .empty { color: var(--text-2); padding: var(--space) 0; }
  .dd { position: relative; }
  .dd-btn { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--bg); }
  .dd-btn .label { flex: 1; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dd-list { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 4px); list-style: none; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 4px; max-height: 200px; overflow: auto; }
  .dd-list[hidden] { display: none; }
  .dd-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  .dd-opt[aria-selected=true] { font-weight: 600; }
  .dd-opt:hover, .dd-opt.active { background: var(--surface); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .seg label { margin: 0; position: relative; text-align: center; cursor: pointer; padding: 6px 0; color: var(--text); }
  .seg label + label { border-left: 1px solid var(--border); }
  .seg input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  .seg.three { grid-template-columns: repeat(3, 1fr); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -12px -12px 12px; padding: 0 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--text-2); padding: 10px 10px 8px; font-weight: 500; }
  .tab[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .badge { background: var(--surface); border-radius: 99px; padding: 0 6px; font-size: 10px; margin-left: 4px; }
  .panel[hidden] { display: none; }
  .filters { display: flex; flex-direction: column; gap: var(--space); margin-bottom: var(--space); }
  .filters select { width: 100%; }
  .field-legend { color: var(--text-2); margin-bottom: 4px; padding: 0; }
  .req { color: var(--error); font-weight: 600; }
  .req-note { color: var(--text-2); font-size: 10px; margin-left: 2px; }
  .hint { color: var(--text-2); font-size: 11px; margin-top: 4px; }
  fieldset { border: 0; min-width: 0; }
  .placement { grid-column: 1 / 4; display: flex; flex-direction: column; gap: var(--space); border-top: 1px solid var(--border); padding-top: var(--space); }
  .placement .seg label { padding: 4px 0; }
  details.section { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 8px; }
  details.section summary { cursor: pointer; font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; padding: 4px 0; }
  details.section[open] summary { margin-bottom: var(--space); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-add" aria-controls="panel-add" aria-selected="true" type="button">Add</button>
    <button class="tab" role="tab" id="tab-notes" aria-controls="panel-notes" aria-selected="false" tabindex="-1" type="button">Notes<span class="badge" id="count" hidden></span></button>
    <button class="tab" role="tab" id="tab-table" aria-controls="panel-table" aria-selected="false" tabindex="-1" type="button">Generate table</button>
  </div>

  <section class="panel" id="panel-add" role="tabpanel" aria-labelledby="tab-add">
  <form id="add" class="stack">
    <div class="dd" id="dd">
      <label id="cat-label" for="cat-btn">Category</label>
      <button type="button" class="dd-btn" id="cat-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cat-label cat-name">
        <span class="swatch" id="cat-swatch"></span><span class="label" id="cat-name"></span><span aria-hidden="true">▾</span>
      </button>
      <ul class="dd-list" id="cat-list" role="listbox" aria-labelledby="cat-label" tabindex="-1" hidden></ul>
    </div>
    <fieldset style="border:0">
      <legend style="color:var(--text-2);margin-bottom:4px">Appears</legend>
      <div class="seg" role="radiogroup" aria-label="Annotation direction">
        <label><input type="radio" name="dir" value="left" checked /> ← Left</label>
        <label><input type="radio" name="dir" value="top" /> ↑ Top</label>
        <label><input type="radio" name="dir" value="bottom" /> ↓ Bottom</label>
        <label><input type="radio" name="dir" value="right" /> → Right</label>
      </div>
    </fieldset>
    <fieldset style="border:0">
      <legend style="color:var(--text-2);margin-bottom:4px">Pointer line</legend>
      <div class="seg two" role="radiogroup" aria-label="Pointer line style">
        <label><input type="radio" name="pstyle" value="elbow" checked /> ⌐ Elbow</label>
        <label><input type="radio" name="pstyle" value="straight" /> ╱ Straight</label>
      </div>
    </fieldset>
    <div>
      <label for="distance">Distance from layer (px)</label>
      <div class="row">
        <input type="range" id="distance-range" min="0" max="400" step="10" value="60" aria-label="Distance slider" style="flex:1" />
        <input type="number" id="distance" min="0" max="2000" step="10" value="60" style="width:72px" />
      </div>
    </div>
    <div>
      <label for="text">Annotation text <span class="req" aria-hidden="true">*</span> <span class="req-note">Required</span></label>
      <textarea id="text" required aria-required="true" aria-describedby="text-hint" placeholder="Describe the behaviour, content or hand-off detail…"></textarea>
      <p class="hint" id="text-hint">Shown on the annotation card and in the summary table.</p>
    </div>
    <button class="primary" type="submit" id="add-btn" disabled>Annotate selected layer</button>
  </form>

  <details class="section" id="cats-section">
    <summary>Manage categories <span id="cats-count"></span></summary>
    <div id="cats" class="stack"></div>
    <div class="row" style="margin-top:8px">
      <button id="add-cat" type="button">Add category</button>
      <button id="save-cats" type="button">Save</button>
    </div>
  </details>
  </section>

  <section class="panel" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" hidden>
    <div class="filters">
      <div class="seg three" role="radiogroup" aria-label="Filter by status">
        <label><input type="radio" name="fstatus" value="all" checked /> All</label>
        <label><input type="radio" name="fstatus" value="todo" /> To do</label>
        <label><input type="radio" name="fstatus" value="done" /> Done</label>
      </div>
      <select id="fcat" aria-label="Filter by category"></select>
    </div>
    <div id="notes" class="stack" aria-live="polite"></div>
    <div class="row" style="margin-top:8px">
      <button id="resync-btn" type="button" title="Move every note back to its saved distance from its layer">Re-anchor notes</button>
    </div>
  </section>

  <section class="panel stack" id="panel-table" role="tabpanel" aria-labelledby="tab-table" hidden>
    <fieldset>
      <legend class="field-legend">Annotations to include</legend>
      <div class="seg two" role="radiogroup" aria-label="Which pages to include">
        <label><input type="radio" name="tscope" value="all-pages" checked /> All pages</label>
        <label><input type="radio" name="tscope" value="this-page" /> This page</label>
      </div>
      <p class="hint" id="scope-hint"></p>
    </fieldset>
    <fieldset>
      <legend class="field-legend">Put the table on</legend>
      <div class="seg two" role="radiogroup" aria-label="Where to put the table">
        <label><input type="radio" name="tdest" value="summary-page" checked /> Summary page</label>
        <label><input type="radio" name="tdest" value="current-page" /> Current page</label>
      </div>
      <p class="hint" id="dest-hint"></p>
    </fieldset>
    <button class="primary" id="table-btn" type="button">Build summary table</button>
  </section>

  <p id="status" role="status"></p>

<script>
  let state = { categories: [], notes: [], tables: { summaryPage: false, currentPage: false }, selectionCount: 0 };
  let draftCats = [];
  let distanceLoaded = false;
  const openEditors = new Set(); // note ids whose placement editor is open
  const drafts = new Map(); // note id -> unsaved { direction, distance }, survives re-renders
  const selectedPointerStyle = () => document.querySelector('input[name=pstyle]:checked').value;
  const $ = (id) => document.getElementById(id);
  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
  const catOf = (id) => state.categories.find((c) => c.id === id);

  function el(tag, props, ...kids) {
    const n = Object.assign(document.createElement(tag), props || {});
    kids.forEach((k) => n.append(k));
    return n;
  }

  // ── Category dropdown (custom listbox so options can show colour swatches) ──
  let selectedCat = '';
  let activeIdx = -1;
  const ddBtn = $('cat-btn'), ddList = $('cat-list');

  function renderSelect() {
    if (!state.categories.some((c) => c.id === selectedCat)) selectedCat = state.categories.length ? state.categories[0].id : '';
    const cur = catOf(selectedCat);
    $('cat-name').textContent = cur ? cur.name : 'No categories';
    $('cat-swatch').style.background = '#' + (cur ? cur.color : '999999');
    ddList.replaceChildren(...state.categories.map((c, i) => {
      const sw = el('span', { className: 'swatch' });
      sw.style.background = '#' + c.color;
      const li = el('li', { className: 'dd-opt', role: 'option', id: 'opt-' + i, ariaSelected: String(c.id === selectedCat) }, sw, c.name);
      li.addEventListener('click', () => { choose(c.id); closeDd(true); });
      return li;
    }));
  }
  function setActive(i) {
    const opts = ddList.children;
    if (!opts.length) return;
    activeIdx = (i + opts.length) % opts.length;
    Array.from(opts).forEach((o, n) => o.classList.toggle('active', n === activeIdx));
    ddList.setAttribute('aria-activedescendant', 'opt-' + activeIdx);
    opts[activeIdx].scrollIntoView({ block: 'nearest' });
  }
  function openDd() {
    ddList.hidden = false; ddBtn.setAttribute('aria-expanded', 'true');
    setActive(Math.max(0, state.categories.findIndex((c) => c.id === selectedCat)));
    ddList.focus();
  }
  function closeDd(refocus) {
    ddList.hidden = true; ddBtn.setAttribute('aria-expanded', 'false');
    if (refocus) ddBtn.focus();
  }
  function choose(id) { selectedCat = id; renderSelect(); }
  ddBtn.addEventListener('click', () => (ddList.hidden ? openDd() : closeDd(true)));
  ddList.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(activeIdx + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(activeIdx - 1); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (state.categories[activeIdx]) choose(state.categories[activeIdx].id); closeDd(true); }
    else if (e.key === 'Escape' || e.key === 'Tab') { closeDd(e.key === 'Escape'); }
  });
  document.addEventListener('click', (e) => { if (!$('dd').contains(e.target)) closeDd(false); });

  const DIRS = [['left', '← Left'], ['top', '↑ Top'], ['bottom', '↓ Bottom'], ['right', '→ Right']];
  function placementEditor(n) {
    const draft = drafts.get(n.id) || { direction: n.direction, distance: n.distance };
    drafts.set(n.id, draft);
    const group = el('div', { className: 'seg', role: 'radiogroup', ariaLabel: 'Direction' });
    DIRS.forEach(([value, text]) => {
      const radio = el('input', { type: 'radio', name: 'ndir-' + n.id, value, checked: draft.direction === value });
      radio.addEventListener('change', () => { draft.direction = value; });
      group.append(el('label', {}, radio, ' ' + text));
    });
    const dist = el('input', { type: 'number', min: 0, max: 2000, step: 10, value: draft.distance, ariaLabel: 'Distance in pixels' });
    dist.style.width = '72px';
    dist.addEventListener('input', () => { draft.distance = Number(dist.value) || 0; });
    const apply = el('button', { className: 'primary', type: 'button', textContent: 'Apply' });
    apply.addEventListener('click', () => { drafts.delete(n.id); post({ type: 'set-note-placement', noteId: n.id, direction: draft.direction, distance: draft.distance }); });
    const catSelect = el('select', { ariaLabel: 'Category' },
      ...state.categories.map((c) => el('option', { value: c.id, textContent: c.name, selected: c.id === n.categoryId })));
    catSelect.addEventListener('change', () => post({ type: 'set-note-category', noteId: n.id, categoryId: catSelect.value }));
    return el('div', { className: 'placement' }, el('label', {}, 'Category', catSelect), group, el('div', { className: 'row' }, el('span', { textContent: 'Distance (px)' }), dist, apply));
  }

  // ── Tabs ──
  const TABS = ['add', 'notes', 'table'];
  function showTab(name, focus) {
    TABS.forEach((t) => {
      const on = t === name;
      $('tab-' + t).setAttribute('aria-selected', String(on));
      $('tab-' + t).tabIndex = on ? 0 : -1;
      $('panel-' + t).hidden = !on;
    });
    if (focus) $('tab-' + name).focus();
  }
  TABS.forEach((t, i) => {
    $('tab-' + t).addEventListener('click', () => showTab(t));
    $('tab-' + t).addEventListener('keydown', (e) => {
      const next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null;
      if (next === null) return;
      e.preventDefault();
      showTab(TABS[(next + TABS.length) % TABS.length], true);
    });
  });

  // ── Notes filters (this page's notes, narrowed by status and category) ──
  const filterStatus = () => document.querySelector('input[name=fstatus]:checked').value;
  const matchesFilters = (n) => (filterStatus() === 'all' || n.status === filterStatus()) && (!$('fcat').value || n.categoryId === $('fcat').value);
  function renderFilterCats() {
    const keep = $('fcat').value;
    $('fcat').replaceChildren(el('option', { value: '', textContent: 'All categories' }), ...state.categories.map((c) => el('option', { value: c.id, textContent: c.name })));
    $('fcat').value = state.categories.some((c) => c.id === keep) ? keep : '';
  }
  document.querySelectorAll('input[name=fstatus]').forEach((r) => r.addEventListener('change', renderNotes));
  $('fcat').addEventListener('change', renderNotes);

  function renderNotes() {
    $('count').textContent = state.notes.length;
    $('count').hidden = !state.notes.length;
    const shown = state.notes.filter(matchesFilters);
    if (!shown.length) {
      $('notes').replaceChildren(el('p', { className: 'empty', textContent: state.notes.length ? 'No annotations match these filters.' : 'No annotations on this page yet.' }));
      return;
    }
    $('notes').replaceChildren(...shown.map((n) => {
      const cat = catOf(n.categoryId);
      const box = el('input', { type: 'checkbox', checked: n.status === 'done', ariaLabel: `Mark complete: ${n.text}` });
      box.addEventListener('change', () => post({ type: 'set-status', noteId: n.id, status: box.checked ? 'done' : 'todo' }));
      const chip = el('span', { className: 'chip', textContent: cat ? cat.name : 'Uncategorised' });
      chip.style.background = '#' + (cat ? cat.color : '999999');
      const go = el('button', { className: 'icon', textContent: 'View', type: 'button' });
      go.addEventListener('click', () => post({ type: 'goto-note', noteId: n.id }));
      const nextStyle = n.pointerStyle === 'elbow' ? 'straight' : 'elbow';
      const style = el('button', { className: 'icon', type: 'button', textContent: n.pointerStyle === 'elbow' ? '⌐ Elbow' : '╱ Straight', title: 'Switch pointer to ' + nextStyle, ariaLabel: 'Pointer is ' + n.pointerStyle + '. Switch to ' + nextStyle });
      style.addEventListener('click', () => post({ type: 'set-note-pointer-style', noteId: n.id, pointerStyle: nextStyle }));
      const edit = el('button', { className: 'icon', type: 'button', textContent: 'Edit', ariaExpanded: String(openEditors.has(n.id)), title: 'Change category, direction and distance' });
      edit.addEventListener('click', () => { openEditors.has(n.id) ? openEditors.delete(n.id) : openEditors.add(n.id); renderNotes(); });
      const del = el('button', { className: 'icon', textContent: '✕', type: 'button', ariaLabel: 'Delete note' });
      del.addEventListener('click', () => post({ type: 'delete-note', noteId: n.id }));
      const card = el('div', { className: 'note ' + n.status },
        box, el('div', {}, chip, el('div', { className: 'text', textContent: n.text })), el('div', { className: 'row' }, style, edit, go, del),
        el('div', { className: 'meta', textContent: `${n.frameName} › ${n.targetName}` }));
      if (openEditors.has(n.id)) card.append(placementEditor(n));
      return card;
    }));
  }

  function renderCats() {
    $('cats-count').textContent = '(' + draftCats.length + ')';
    $('cats').replaceChildren(...draftCats.map((c, i) => {
      const color = el('input', { type: 'color', value: '#' + c.color, ariaLabel: `${c.name} colour` });
      color.addEventListener('input', () => { c.color = color.value.slice(1).toUpperCase(); });
      const name = el('input', { type: 'text', value: c.name, ariaLabel: 'Category name' });
      name.addEventListener('input', () => { c.name = name.value; });
      const rm = el('button', { className: 'icon', textContent: '✕', type: 'button', ariaLabel: `Remove ${c.name}` });
      rm.addEventListener('click', () => { draftCats.splice(i, 1); renderCats(); });
      return el('div', { className: 'cat-row' }, color, name, rm);
    }));
  }

  // The button says "Update table" when a table already exists at the chosen destination.
  function renderTableButton() {
    const dest = document.querySelector('input[name=tdest]:checked').value;
    const exists = dest === 'summary-page' ? state.tables.summaryPage : state.tables.currentPage;
    $('table-btn').textContent = exists ? 'Update table' : 'Build summary table';
    const n = state.notes.length;
    $('scope-hint').textContent = document.querySelector('input[name=tscope]:checked').value === 'this-page'
      ? `${n} annotation${n === 1 ? '' : 's'} on this page.`
      : 'Every page except the summary page.';
    $('dest-hint').textContent = (exists ? 'Replaces the existing table' : 'Creates a table') + (dest === 'summary-page' ? ' on the summary page.' : ' on this page.');
  }
  document.querySelectorAll('input[name=tdest], input[name=tscope]').forEach((r) => r.addEventListener('change', renderTableButton));

  function setStatus(kind, message) { const s = $('status'); s.className = kind; s.textContent = message; }

  // The note needs both one selected layer and some annotation text.
  function updateAddBtn() {
    const hasText = $('text').value.trim().length > 0;
    const oneLayer = state.selectionCount === 1;
    $('add-btn').disabled = !oneLayer || !hasText;
    $('add-btn').textContent = !oneLayer ? 'Select one layer to annotate' : !hasText ? 'Enter annotation text' : 'Annotate selected layer';
  }
  $('text').addEventListener('input', updateAddBtn);
  $('add').addEventListener('submit', (e) => { e.preventDefault(); if (!$('text').value.trim()) { $('text').focus(); return; } post({ type: 'add-note', text: $('text').value, categoryId: selectedCat, direction: document.querySelector('input[name=dir]:checked').value, distance: Number($('distance').value) || 0, pointerStyle: selectedPointerStyle() }); });
  // Keep slider and number field in sync; the number field accepts values beyond the slider range.
  $('distance-range').addEventListener('input', () => { $('distance').value = $('distance-range').value; });
  $('distance').addEventListener('input', () => { $('distance-range').value = Math.min(Number($('distance').value) || 0, 400); });
  // Persist the distance once the user commits a value (not on every keystroke).
  const commitDistance = () => post({ type: 'save-distance', distance: Number($('distance').value) || 0 });
  $('distance').addEventListener('change', commitDistance);
  $('distance-range').addEventListener('change', commitDistance);
  document.querySelectorAll('input[name=pstyle]').forEach((r) => r.addEventListener('change', () => post({ type: 'save-pointer-style', pointerStyle: selectedPointerStyle() })));
  $('table-btn').addEventListener('click', () => post({ type: 'build-table', options: {
    scope: document.querySelector('input[name=tscope]:checked').value,
    destination: document.querySelector('input[name=tdest]:checked').value,
  } }));
  $('resync-btn').addEventListener('click', () => post({ type: 'resync' }));
  $('add-cat').addEventListener('click', () => { draftCats.push({ id: 'c' + Date.now(), name: 'New category', color: '0D99FF' }); renderCats(); });
  $('save-cats').addEventListener('click', () => post({ type: 'save-categories', categories: draftCats }));

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'state') {
      state = msg;
      if (!distanceLoaded) { // restore the saved distance once; later state pushes must not clobber typing
        $('distance').value = msg.distance; $('distance-range').value = Math.min(msg.distance, 400);
        const pick = document.querySelector('input[name=pstyle][value=' + msg.pointerStyle + ']');
        if (pick) pick.checked = true;
        distanceLoaded = true;
      }
      draftCats = msg.categories.map((c) => Object.assign({}, c));
      updateAddBtn();
      renderSelect(); renderFilterCats(); renderNotes(); renderCats(); renderTableButton();
    } else if (msg.type === 'success') { setStatus('success', msg.message); $('text').value = ''; updateAddBtn(); }
    else if (msg.type === 'error') setStatus('error', msg.message);
    else if (msg.type === 'progress') setStatus('', msg.message);
  };
  post({ type: 'init' });
</script>
</body>
</html>
